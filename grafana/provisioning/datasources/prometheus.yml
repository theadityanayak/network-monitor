# ─────────────────────────────────────────────────────────────
#  provisioning/datasources/prometheus.yml
#  Auto-provisions Prometheus as Grafana's default data source.
# ─────────────────────────────────────────────────────────────

apiVersion: 1

datasources:
  - name: Prometheus
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
    editable: false
    jsonData:
      httpMethod: POST
      prometheusType: Prometheus
      prometheusVersion: 2.45.0
      timeInterval: "15s"
