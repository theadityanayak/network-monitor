# ─────────────────────────────────────────────────────────────
#  devices.yaml — Network Monitor Device Configuration
#
#  Add or remove entries to control which hosts are monitored.
#  SNMP v2c is used for all devices.
#  Set snmp_enabled: false to perform ICMP-only monitoring.
# ─────────────────────────────────────────────────────────────

devices:

  # ── Local / Docker network ─────────────────────────────────
  - name: "localhost"
    ip: "127.0.0.1"
    location: "local"
    snmp_enabled: false           # no SNMP agent on loopback

  - name: "docker-gateway"
    ip: "172.17.0.1"             # default Docker bridge gateway
    location: "docker"
    snmp_enabled: false
  - name: "my-macbook"
    ip: "10.67.210.44"
    location: "home"
    snmp_enabled: false    # Macs don't run SNMP by default
    
