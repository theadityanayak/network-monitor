# ─────────────────────────────────────────────────────────────
#  prometheus.yml — Prometheus Scrape Configuration
# ─────────────────────────────────────────────────────────────

global:
  scrape_interval:     15s   # How often Prometheus scrapes targets
  evaluation_interval: 15s   # How often rules are evaluated
  scrape_timeout:      10s

# ── Alertmanager (optional — connect your own instance) ──────
# alerting:
#   alertmanagers:
#     - static_configs:
#         - targets: ["alertmanager:9093"]

# ── Recording / Alerting Rules ────────────────────────────────
rule_files:
  - "/etc/prometheus/rules/*.yml"

# ── Scrape Jobs ───────────────────────────────────────────────
scrape_configs:

  # Network Monitor Exporter (our custom Python service)
  - job_name: "network_monitor"
    static_configs:
      - targets: ["exporter:9200"]
    metrics_path: "/metrics"
    relabel_configs:
      - source_labels: [__address__]
        target_label: instance

  # Prometheus self-monitoring
  - job_name: "prometheus"
    static_configs:
      - targets: ["localhost:9090"]
